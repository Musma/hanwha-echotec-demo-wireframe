<style>
  html, body { margin: 0; height: 100%; }
  *, *::before, *::after { box-sizing: border-box; }
  a { color: var(--blue-dark); text-decoration: none; }
  a:hover { color: var(--blue-main); }
  button { white-space: nowrap; }
  .wa-mod { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border: 1px solid var(--border-input); border-radius: 999px; background: var(--bg-primary); color: var(--text-secondary); font: 500 13px var(--font-content); cursor: pointer; flex-shrink: 0; }
  .wa-mod:hover { border-color: var(--brand-primary); color: var(--brand-primary); }
  .wa-mod[data-on="true"] { border-color: var(--brand-primary); background: var(--status-wait-bg); color: var(--brand-primary); font-weight: 700; }
  .wa-chip { height: 24px; padding: 0 8px; border: 1px solid var(--border-input); border-radius: 999px; background: var(--bg-primary); color: var(--text-secondary); font: 700 11px var(--font-content); font-variant-numeric: tabular-nums; cursor: pointer; flex-shrink: 0; }
  .wa-chip:hover { border-color: var(--brand-primary); color: var(--brand-primary); }
  .wa-chip[data-on="true"] { border-color: var(--brand-primary); background: var(--status-wait-bg); color: var(--brand-primary); }
</style>
</helmet>

<div style="display:flex; flex-direction:column; height:100vh; width:100%; overflow:hidden; background:var(--gray-5); font-family:var(--font-primary); color:var(--text-secondary);">

      <sc-for list="{{ modules }}" as="m" hint-placeholder-count="12">

    </div>
    <div style="display:flex; align-items:center; gap:5px; padding:0 16px 10px; overflow-x:auto;">
      <span style="font:400 11px var(--font-content); color:var(--text-tertiary); white-space:nowrap; flex-shrink:0; margin-right:3px;">화면 ID</span>
      <sc-for list="{{ screens }}" as="s" hint-placeholder-count="12">
        <button class="wa-chip" onClick="{{ s.onClick }}" data-on="{{ s.on }}" title="{{ s.title }}">{{ s.id }}</button>

    </sc-for>
  </div>
</div>

  common: "pages/00 공통/",
  dash: "pages/01 대시보드/",
  jibun: "pages/02 지번관리/",
  material: "pages/03 자재관리/",
  block: "pages/04 블록관리/",
  req: "pages/05 중기배차신청/",
  plan: "pages/06 중기배차계획/",
  result: "pages/07 배차실적/",
  util: "pages/08 장비가동률/",
  resource: "pages/09 운송자원정보관리/",
  alarm: "pages/10 알람/",
  system: "pages/11 시스템관리/",
};
MODULES.forEach((m) => {
  const dir = DIRS[m.key] || "";
  m.screens.forEach((s) => { if (s[2].indexOf("pages/") !== 0) s[2] = dir + s[2]; });
});

class Component extends DCLogic {
  state = { mod: 1, scr: 0, loaded: [] };

  componentDidMount() { this.touch(); }
  componentDidUpdate() { this.touch(); }

  touch() {
    const mod = MODULES[this.state.mod] || MODULES[0];
    const scr = mod.screens[this.state.scr] || mod.screens[0];
    if (!this.state.loaded.includes(scr[2])) {
      this.setState(st => st.loaded.includes(scr[2]) ? null : { loaded: [...st.loaded, scr[2]] });
    }
  }

  renderVals() {
    const s = this.state;
    const mod = MODULES[s.mod] || MODULES[0];
    const scr = mod.screens[s.scr] || mod.screens[0];
    return {
      modules: MODULES.map((m, i) => ({
        title: m.title, icon: m.icon, count: m.screens.length,
        on: i === s.mod,
        onClick: () => this.setState({ mod: i, scr: 0 }),
      })),
      screens: mod.screens.map((x, i) => ({
        id: x[0], title: x[0] + " " + x[1],
        on: i === s.scr,
        onClick: () => this.setState({ scr: i }),
      })),
      curLabel: scr[0] + " " + scr[1],
      frames: this.state.loaded.map(src => ({
        src, title: src,
        style: "width:100%; height:100%; border:none; background:var(--bg-primary); display:" + (src === scr[2] ? "block" : "none"),
      })),
    };
  }
}
